# Alembic configuration for MatchWise (Phase 5.1).
#
# The URL is intentionally left blank: `migrations/env.py` reads
# DATABASE_URL from the backend settings (backend/.env) and lets
# ALEMBIC_DATABASE_URL override it, so the application has one source of truth
# for its connection string.
#
# Common commands (run from backend/ with the virtualenv active):
#   alembic upgrade head            # apply pending migrations
#   alembic current                 # show the applied revision
#   alembic revision -m "message"   # create a new revision (with --autogenerate
#                                   # to diff against the models)
#   alembic stamp head              # mark an existing, up-to-date database
#                                   # as migrated without running DDL

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
